name: package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package versions
        shell: bash
        run: |
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          packager_version="$(awk -F'"' '/^version = / { print $2; exit }' Packager.toml)"
          test "$cargo_version" = "$packager_version" || {
            echo "Version mismatch: Cargo.toml=$cargo_version Packager.toml=$packager_version"
            exit 1
          }
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$cargo_version" || {
              echo "Tag ${GITHUB_REF_NAME} does not match version ${cargo_version}"
              exit 1
            }
          fi

  package:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            command: pwsh -NoProfile -File ./scripts/package-windows.ps1 -Arch x64
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            command: pwsh -NoProfile -File ./scripts/package-windows.ps1 -Arch arm64
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            command: bash ./scripts/package-linux.sh x64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            command: bash ./scripts/package-linux.sh arm64
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            command: bash ./scripts/package-macos.sh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config ruby ruby-dev rubygems rpm xz-utils \
            zlib1g-dev libssl-dev \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
          sudo gem install --no-document fpm

      - name: Build and package
        run: ${{ matrix.command }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/rshell-*
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/rshell-*
          generate_release_notes: true
